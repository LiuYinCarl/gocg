name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: smoke (self analysis)
        shell: bash
        run: |
          go build -o gocg .
          ./gocg . --lookup main.main | grep -q graph.Build
          printf '@ show\n' | ./gocg . >/dev/null
          ./gocg . --clear-cache >/dev/null
        if: matrix.os != 'windows-latest'
