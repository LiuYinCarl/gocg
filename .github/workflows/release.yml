name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: cross-compile
        shell: bash
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            bin="gocg"
            ext="tar.gz"
            if [ "$os" = "windows" ]; then bin="gocg.exe"; ext="zip"; fi
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/$bin" .
            (cd dist && if [ "$ext" = "zip" ]; then zip -q "gocg_${os}_${arch}.zip" "$bin"; else tar -czf "gocg_${os}_${arch}.tar.gz" "$bin"; fi && rm "$bin")
          done
          ls -la dist

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
